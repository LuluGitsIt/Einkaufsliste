<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Einkaufsliste Holzwerkstatt</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪵</text></svg>" />

<style>
:root{
  --bg:#f4efe6;
  --surface:#ffffff;
  --border:#e6dfd0;
  --text:#2c2620;
  --text-muted:#7a7264;
  --primary:#b3661d;
  --primary-dark:#8f5015;
  --danger:#c0392b;
  --danger-bg:#fbdedb;
  --warning:#8a6a06;
  --warning-bg:#fdf0cd;
  --violet:#5732a8;
  --violet-bg:#e6ddf7;
  --wish:#a3226e;
  --wish-bg:#fbe2ef;
  --wish-item-bg:#fdf3f8;
  --maren:#2f6fbf;
  --maren-bg:#e1ebf9;
  --luisa:#0e7c86;
  --luisa-bg:#dcf0f1;
  --radius:10px;
  --shadow:0 1px 3px rgba(43,34,20,0.08),0 1px 2px rgba(43,34,20,0.05);
}

*{ box-sizing:border-box; }

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  margin:0;
}

.page{
  max-width:880px;
  margin:0 auto;
  padding:36px 20px 80px;
}

.app-header{
  text-align:center;
  margin-bottom:28px;
}

.app-header h1{
  font-size:26px;
  margin:0;
  letter-spacing:-.01em;
}

#statusMsg{
  display:none;
  position:sticky;
  top:12px;
  z-index:10;
  padding:12px 16px;
  margin-bottom:18px;
  border-radius:var(--radius);
  font-weight:600;
  font-size:14px;
  box-shadow:var(--shadow);
}

.toolbar{
  display:flex;
  gap:10px;
  margin-bottom:24px;
  flex-wrap:wrap;
}

.toolbar button{
  padding:12px 20px;
  border-radius:10px;
  font-size:14px;
  font-weight:600;
  box-shadow:var(--shadow);
}

.btn-add{ background:var(--primary); color:#fff; }
.btn-add:hover{ background:var(--primary-dark); }

.btn-inventory{ background:var(--surface); color:var(--text); border:1px solid var(--border); }
.btn-inventory:hover{ background:var(--bg); }
.btn-inventory.active{ background:var(--primary); color:#fff; border-color:var(--primary); }

.machine-grid{
  display:flex;
  flex-direction:column;
  gap:14px;
}

.machine-group{
  border:1px solid var(--border);
  border-radius:var(--radius);
  overflow:hidden;
  background:var(--bg);
}

.machine-row{
  display:flex;
  align-items:center;
  gap:14px;
  padding:12px 16px;
  cursor:pointer;
  transition:background .15s;
}

.machine-row:hover{ background:rgba(43,34,20,0.05); }

.machine-row + .machine-row{
  border-top:1px solid var(--border);
}

.machine-photo{
  width:60px;
  height:60px;
  border-radius:50%;
  background:var(--surface);
  border:1px solid var(--border);
  flex-shrink:0;
}

.machine-photo-large{
  width:170px;
  height:170px;
  border-radius:50%;
  background:var(--bg);
  border:1px solid var(--border);
}

.machine-name{
  font-size:14px;
  font-weight:600;
  color:var(--text);
}

.machine-description{
  font-size:14px;
  color:var(--text);
  text-align:center;
  margin:0 0 14px;
  line-height:1.5;
}

.machine-notes{
  background:var(--warning-bg);
  color:var(--warning);
  font-size:13px;
  font-weight:600;
  padding:10px 14px;
  border-radius:8px;
  text-align:center;
  margin-bottom:14px;
}

.machine-links{
  display:flex;
  justify-content:center;
  gap:16px;
  margin-bottom:16px;
  flex-wrap:wrap;
}

.machine-links a{
  color:var(--primary);
  font-weight:600;
  font-size:13.5px;
  text-decoration:none;
}

.machine-links a:hover{ text-decoration:underline; }

.gerat-card{
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:24px 16px;
  margin-bottom:20px;
  background:var(--bg);
}

.gerat-card:last-child{ margin-bottom:0; }

.photo-edit-btn{
  position:absolute;
  bottom:2px;
  right:2px;
  width:36px;
  height:36px;
  border-radius:50%;
  background:var(--surface);
  border:1px solid var(--border);
  box-shadow:var(--shadow);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:15px;
  padding:0;
}

.photo-edit-btn:hover{ background:var(--bg); }

.tab-content{ display:none; }
.tab-content.active{ display:block; }

.card{
  background:var(--surface);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:22px;
  margin-bottom:24px;
}

.card h2{
  margin:0 0 16px;
  font-size:17px;
}

.list-total{
  text-align:center;
  font-size:13px;
  font-weight:600;
  color:var(--text-muted);
  margin:-8px 0 16px;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-bottom:14px;
}

.form-grid .full{ grid-column:1 / -1; }

label{
  display:block;
  font-size:11px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.04em;
  color:var(--text-muted);
  margin-bottom:5px;
}

input,select{
  width:100%;
  padding:10px 12px;
  border:1px solid var(--border);
  border-radius:8px;
  font-size:14px;
  background:#fff;
  color:var(--text);
  font-family:inherit;
}

input:focus,select:focus{
  outline:none;
  border-color:var(--primary);
}

button{
  border:none;
  border-radius:8px;
  font-family:inherit;
  font-weight:600;
  cursor:pointer;
  transition:background .15s,transform .05s;
}

button:active{ transform:scale(0.97); }

.btn-primary{
  width:100%;
  padding:11px 16px;
  font-size:14px;
  background:var(--primary);
  color:#fff;
}

.btn-primary:hover{ background:var(--primary-dark); }

ul{ list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:10px; }

li.item{
  position:relative;
  display:flex;
  justify-content:space-between;
  align-items:stretch;
  gap:14px;
  padding:14px 16px;
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:var(--radius);
}

.mark-badges{
  position:absolute;
  top:-9px;
  right:14px;
  display:flex;
  gap:4px;
  z-index:2;
}

.mark-badge{
  font-size:10.5px;
  font-weight:700;
  padding:3px 9px;
  border-radius:20px;
  color:#fff;
  box-shadow:var(--shadow);
  white-space:nowrap;
}

.mark-badge.maren{ background:var(--maren); }
.mark-badge.luisa{ background:var(--luisa); }

li.item.wish{
  background:var(--wish-item-bg);
  border-color:#f0c7de;
}

.item-info{
  display:flex;
  flex-direction:column;
  gap:7px;
  flex:1;
  min-width:0;
}

.item-info strong.item-name{
  font-size:15px;
  overflow-wrap:anywhere;
}

.item-meta{
  font-size:12.5px;
  color:var(--text-muted);
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

.item-meta a{
  color:var(--primary);
  text-decoration:none;
  font-weight:600;
}

.item-meta a:hover{ text-decoration:underline; }

.item-meta b{
  color:var(--text);
  font-weight:700;
}

.priority-swatch{
  width:14px;
  align-self:stretch;
  flex-shrink:0;
  border:none;
  border-radius:7px;
  cursor:pointer;
  padding:0;
  transition:opacity .15s,transform .05s;
}

.priority-swatch:hover{ opacity:.82; }
.priority-swatch:active{ transform:scale(0.94); }
.priority-swatch.green{ background:#3fa757; }
.priority-swatch.yellow{ background:#eeb412; }
.priority-swatch.red{ background:#dd4b3e; }

.badge-wish{
  font-size:11px;
  font-weight:700;
  padding:3px 10px;
  border-radius:20px;
  width:fit-content;
  background:var(--wish-bg);
  color:var(--wish);
}

.reorder{
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:2px;
  flex-shrink:0;
}

.reorder button{
  width:26px;
  height:22px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
  background:transparent;
  color:var(--text-muted);
}

.reorder button svg{ width:15px; height:15px; }
.reorder button:hover:not(:disabled){ color:var(--primary); }
.reorder button:disabled{ opacity:.25; cursor:default; }

.card-header{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:10px;
  margin-bottom:16px;
}

.card-header h2{ margin:0; text-align:center; }

.header-btn{
  justify-self:end;
  background:var(--surface);
  border:1px solid var(--border);
  color:var(--text);
  padding:8px 12px;
  border-radius:8px;
  font-size:12.5px;
  font-weight:600;
  white-space:nowrap;
}

.header-btn:hover{ background:var(--bg); }

.sort-dropdown{
  position:relative;
  justify-self:end;
}

.sort-dropdown summary{
  list-style:none;
  cursor:pointer;
  background:var(--surface);
  border:1px solid var(--border);
  color:var(--text);
  padding:8px 12px;
  border-radius:8px;
  font-size:12.5px;
  font-weight:600;
  white-space:nowrap;
}

.sort-dropdown summary::-webkit-details-marker{ display:none; }
.sort-dropdown summary:hover{ background:var(--bg); }
.sort-dropdown[open] summary{ border-color:var(--primary); }

.sort-options{
  position:absolute;
  top:40px;
  right:0;
  display:flex;
  flex-direction:column;
  gap:6px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:10px;
  box-shadow:var(--shadow);
  padding:8px;
  width:200px;
  z-index:6;
}

.sort-options button{
  background:transparent;
  color:var(--text);
  padding:8px 10px;
  font-size:13px;
  text-align:left;
  width:100%;
}

.sort-options button:hover{ background:var(--bg); }

.item-menu{
  position:relative;
  flex-shrink:0;
  display:flex;
  align-items:center;
}

.item-menu summary{
  list-style:none;
  cursor:pointer;
  width:32px;
  height:32px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--text-muted);
  transition:color .15s;
}

.item-menu summary svg{ width:20px; height:20px; }
.item-menu summary::-webkit-details-marker{ display:none; }
.item-menu summary:hover{ color:var(--primary); }
.item-menu[open] summary{ color:var(--primary); }

.actions{
  position:absolute;
  top:42px;
  right:0;
  display:flex;
  flex-direction:column;
  gap:6px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:10px;
  box-shadow:var(--shadow);
  padding:8px;
  width:min(230px,80vw);
  z-index:5;
}

.actions button{
  padding:9px 12px;
  font-size:13px;
  text-align:left;
  width:100%;
}

button.delete{ background:var(--danger-bg); color:var(--danger); }
button.delete:hover{ background:#f4c6c1; }
button.move{ background:var(--warning-bg); color:var(--warning); }
button.move:hover{ background:#f9e4a8; }
button.copy{ background:var(--violet-bg); color:var(--violet); }
button.copy:hover{ background:#d9c9f2; }
button.wish-toggle{ background:var(--wish-bg); color:var(--wish); }
button.wish-toggle:hover{ background:#f6cce4; }
button.edit{ background:var(--violet-bg); color:var(--violet); }
button.edit:hover{ background:#d9c9f2; }
button.buy{ background:#ddf0e1; color:#1f6b3f; }
button.buy:hover{ background:#c9e8d1; }
button.mark.maren{ background:var(--maren-bg); color:var(--maren); }
button.mark.maren:hover{ background:#cfe0f5; }
button.mark.maren.active{ background:var(--maren); color:#fff; }
button.mark.luisa{ background:var(--luisa-bg); color:var(--luisa); }
button.mark.luisa:hover{ background:#c9e9eb; }
button.mark.luisa.active{ background:var(--luisa); color:#fff; }

.form-actions{
  display:flex;
  gap:10px;
}

.form-actions .btn-primary{ flex:1; }

.btn-secondary{
  padding:11px 16px;
  font-size:14px;
  background:var(--surface);
  color:var(--text);
  border:1px solid var(--border);
}

.btn-secondary:hover{ background:var(--bg); }

.trash-card{ padding:0; }

.trash-card summary{
  list-style:none;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:18px 22px;
  font-weight:700;
  font-size:15px;
}

.trash-card summary::-webkit-details-marker{ display:none; }

.trash-summary-left{
  display:flex;
  align-items:center;
  gap:9px;
  color:var(--text-muted);
}

.trash-card[open] .trash-summary-left{ color:var(--text); }

.trash-count{
  background:var(--border);
  color:var(--text-muted);
  font-size:12px;
  font-weight:700;
  padding:2px 9px;
  border-radius:20px;
}

.trash-card ul{ padding:0 22px 22px; margin:0; }
.trash-card[open] summary{ border-bottom:1px solid var(--border); margin-bottom:0; }

.empty-state{
  text-align:center;
  color:var(--text-muted);
  font-size:13.5px;
  padding:28px 10px;
  border:1px dashed var(--border);
  border-radius:var(--radius);
}

@media(max-width:600px){
  .form-grid{ grid-template-columns:1fr; }
  .card-header{ grid-template-columns:1fr; justify-items:center; gap:8px; }
  .card-header span{ display:none; }
  .card-header .header-btn,
  .card-header .sort-dropdown{ justify-self:center; }
}
</style>
</head>

<body>

<div class="page">

<div class="app-header">
  <h1>🪵 Einkaufssystem Holzwerkstatt</h1>
</div>

<div id="statusMsg"></div>

<div class="toolbar">
  <button id="addFormBtn" class="btn-add" onclick="toggleAddForm()">+ Artikel hinzufügen</button>
  <button id="inventoryBtn" class="btn-inventory" onclick="showTab('inventory')">📦 Inventar</button>
  <button id="machinesBtn" class="btn-inventory" onclick="showTab('machines')">🛠️ Maschinen</button>
</div>

<div id="addForm" class="card" style="display:none;">
  <h2 id="addFormTitle">Artikel hinzufügen</h2>

  <div class="form-grid">
    <div class="full" id="targetField">
      <label for="newTarget">Ziel-Liste</label>
      <select id="newTarget">
        <option value="shoppingList">🛒 Einkaufsliste</option>
        <option value="wishList">🏗️ AG Materialbeschaffung</option>
        <option value="fundingList">📝 Förderantrag</option>
      </select>
    </div>
    <div class="full">
      <label for="newName">Artikel</label>
      <input id="newName" placeholder="z. B. Schleifpapier 120er" />
    </div>
    <div>
      <label for="newAmount">Menge (optional)</label>
      <input id="newAmount" placeholder="z. B. 2x" />
    </div>
    <div>
      <label for="newLink">Link (optional)</label>
      <input id="newLink" placeholder="https://…" />
    </div>
    <div>
      <label for="newPrice">Preis (optional)</label>
      <input id="newPrice" placeholder="z. B. 12,90 €" />
    </div>
    <div>
      <label for="newPriority">Priorität</label>
      <select id="newPriority">
        <option value="green">🟢 Grün</option>
        <option value="yellow">🟡 Gelb</option>
        <option value="red">🔴 Rot</option>
      </select>
    </div>
    <div>
      <label for="newUser">Name</label>
      <input id="newUser" placeholder="Wer trägt ein?" />
    </div>
    <div class="full">
      <label for="newMachine">Für Maschine (optional)</label>
      <select id="newMachine">
        <option value="">– keine –</option>
      </select>
    </div>
    <div class="full">
      <label for="newNote">Notiz (optional)</label>
      <input id="newNote" placeholder="z. B. Anbieter, Kontakt, Alternativpreis" />
    </div>
  </div>

  <div class="form-actions">
    <button id="submitBtn" class="btn-primary" onclick="submitNewItem()">Hinzufügen</button>
    <button id="cancelEditBtn" class="btn-secondary" style="display:none;" onclick="cancelEdit()">Abbrechen</button>
  </div>
</div>

<!-- LISTEN -->
<div id="lists" class="tab-content active">

<div class="card">
  <div class="card-header">
    <span></span>
    <h2>Einkauf AG Materialbeschaffung</h2>
    <button class="header-btn" onclick="exportWishPdf()">📄 PDF exportieren</button>
  </div>
  <p class="list-total" id="wishTotal"></p>

  <ul id="wishList"></ul>
</div>

<div class="card">
  <div class="card-header">
    <span></span>
    <h2>🛒 Einkaufsliste</h2>
    <details class="sort-dropdown" id="sortDropdown">
      <summary>⇅ Sortieren</summary>
      <div class="sort-options">
        <button onclick="sortShoppingList('price')">💶 Preis</button>
        <button onclick="sortShoppingList('date')">📅 Erstellungsdatum</button>
        <button onclick="sortShoppingList('priority')">🚦 Priorität</button>
      </div>
    </details>
  </div>

  <ul id="shoppingList"></ul>
</div>

<div class="card">
  <div class="card-header">
    <span></span>
    <h2>📝 Förderantrag</h2>
    <span></span>
  </div>

  <ul id="fundingList"></ul>
</div>

<details class="card trash-card" id="trashCard">
  <summary>
    <span class="trash-summary-left">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg>
      Gekaufte Artikel
    </span>
    <span class="trash-count" id="trashCount">0</span>
  </summary>
  <ul id="purchasedList"></ul>
</details>

</div>

<!-- INVENTAR -->
<div id="inventory" class="tab-content">
  <div class="card">
    <h2>📦 Inventar</h2>
    <ul id="inventoryList"></ul>
  </div>
</div>

<!-- MASCHINEN -->
<div id="machines" class="tab-content">
  <div class="card">
    <div class="card-header">
      <span></span>
      <h2>🛠️ Maschinen</h2>
      <details class="item-menu" id="machinesMenu" style="justify-self:end;">
        <summary title="Optionen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82A1.65 1.65 0 0 0 3 13.09H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </summary>
        <div class="actions" id="machinesOptionsMenu" style="width:min(280px,85vw);">
          <button onclick="toggleAddMachineForm()">+ Maschine hinzufügen</button>
          <div style="border-top:1px solid var(--border);margin:4px 0;"></div>
          <label style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--text-muted);">Artikel</label>
          <select id="assignArticleSelect"></select>
          <label style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--text-muted);margin-top:6px;">Gerät</label>
          <select id="assignMachineSelect"></select>
          <button class="btn-primary" style="margin-top:10px;" onclick="assignArticleToMachine()">Zuordnen</button>
        </div>
      </details>
    </div>

    <div id="addMachineForm" class="form-grid" style="display:none;margin-bottom:16px;">
      <div class="full">
        <label for="newMachineName">Name der neuen Maschine</label>
        <input id="newMachineName" placeholder="z. B. Kreissäge Werkstatt 2" />
      </div>
      <div class="full form-actions">
        <button class="btn-primary" onclick="submitNewMachine()">Hinzufügen</button>
        <button class="btn-secondary" onclick="toggleAddMachineForm()">Abbrechen</button>
      </div>

   NORMALIZER (WICHTIG!)
========================= */
function normalize(data){
  return {
    name: data.name || "",
    link: data.link || "",
    price: data.price || "",
    amount: data.amount || "",
    priority: data.priority || "green",
    user: data.user || "Unbekannt",
    createdAt: data.createdAt || Date.now(),
    wish: data.wish || false,
    order: data.order ?? data.createdAt ?? Date.now(),
    purchased: data.purchased || false,
    purchasedAt: data.purchasedAt || null,
    markedMaren: data.markedMaren || false,
    markedLuisa: data.markedLuisa || false,
    machine: data.machine || "",
    note: data.note || ""
  };
}

function normalizeMachineInfo(data){
  return {
    name: data.name || "",
    description: data.description || "",
    productLink: data.productLink || "",
    manualLink: data.manualLink || "",
    notes: data.notes || "",
    requiresLicense: data.requiresLicense || false,
    photoUrl: data.photoUrl || "",
    groupId: data.groupId || "",
    parentSlug: data.parentSlug || "",
    createdAt: data.createdAt || Date.now()
  };
}

const priorityRank = { red:0, yellow:1, green:2 };

function parsePrice(str){
  if(!str) return null;
  const m = String(str).match(/\d+(?:,\d+)?/);
  if(!m) return null;
  return parseFloat(m[0].replace(",", "."));
}

function parseAmount(str){
  if(!str) return 1;
  const m = String(str).match(/\d+(?:[.,]\d+)?/);
  if(!m) return 1;
  const n = parseFloat(m[0].replace(",", "."));
  return n > 0 ? n : 1;
}

function lineTotal(data){
  const p = parsePrice(data.price);
  return p===null ? null : p * parseAmount(data.amount);
}

function formatEuro(value){
  return value.toLocaleString("de-DE", { minimumFractionDigits:2, maximumFractionDigits:2 }) + " €";
}

function updateWishTotal(docs){
  if(docs.length === 0){ wishTotal.textContent = ""; return; }
  const totals = docs.map(d=>lineTotal(d.data));
  const sum = totals.reduce((acc,t)=>acc + (t||0), 0);
  const missing = totals.filter(t=>t===null).length;
  wishTotal.textContent = `Gesamtsumme: ${formatEuro(sum)}` + (missing>0 ? ` (${missing} ohne Preis)` : "");
}

/* =========================
   FOTO-UPLOAD (Cloudinary)
========================= */
const CLOUDINARY_CLOUD_NAME = "";
const CLOUDINARY_UPLOAD_PRESET = "";

async function uploadToCloudinary(file){
  const formData = new FormData();
  formData.append("file", file);
  formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);
  const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
    method: "POST",
    body: formData
  });
  const data = await res.json();
  if(!data.secure_url) throw new Error(data.error?.message || "Upload fehlgeschlagen");
  return data.secure_url;
}

/* =========================
   ADD / BEARBEITEN SPEICHERN
========================= */
window.submitNewItem = async function(){
  const base = editContext ? editContext.original : {};
  const data = normalize({
    ...base,
    name:newName.value,
    amount:newAmount.value,
    link:newLink.value,
    price:newPrice.value,
    priority:newPriority.value,
    user:newUser.value,
    machine:newMachine.value,
    note:newNote.value
  });

  if(!data.name || !data.user) return;

  try {
    if(editContext){
      const { collection, id } = editContext;
      await setDoc(doc(db, collection, id), data);
      if(collection !== "inventory"){
        await saveToInventory(data, id);
      }
      showStatus("✅ Aktualisiert: " + data.name, false);
      window.cancelEdit();
    } else {
      const target = newTarget.value;
      const targetRef = collectionRefs[target];
      const ref = await addDoc(targetRef, data);
      await saveToInventory(data, ref.id);
      if(target === "wishList") notifyWishListAdd(data);
      showStatus(`✅ Gespeichert in ${collectionLabels[target]}: ` + data.name, false);
      newName.value="";
      newLink.value="";
      newPrice.value="";
    }
  } catch(e) {
    showStatus("❌ Fehler beim Speichern: " + e.message, true);
    console.error(e);
  }
};

/* =========================
   REIHENFOLGE PER PFEIL (Tausch des order-Felds mit Nachbar)
========================= */
async function moveOrder(collection, docs, index, direction){
  const targetIndex = index + direction;
  if(targetIndex < 0 || targetIndex >= docs.length) return;

  const current = docs[index];
  const neighbor = docs[targetIndex];

  if(collection === "shoppingList" && !!current.data.wish !== !!neighbor.data.wish) return;

  const currentOrder = current.data.order ?? current.data.createdAt ?? 0;
  const neighborOrder = neighbor.data.order ?? neighbor.data.createdAt ?? 0;

  await updateDoc(doc(db,collection,current.id), { order: neighborOrder });
  await updateDoc(doc(db,collection,neighbor.id), { order: currentOrder });
}

function createReorderControls(collection, docs, index){
  const wrap = document.createElement("div");
  wrap.className = "reorder";

  const current = docs[index];
  const prev = docs[index-1];
  const next = docs[index+1];
  const canUp = prev && (collection !== "shoppingList" || !!prev.data.wish === !!current.data.wish);
  const canDown = next && (collection !== "shoppingList" || !!next.data.wish === !!current.data.wish);

  const up = document.createElement("button");
  up.innerHTML = chevronUpIcon;
  up.setAttribute("aria-label","Nach oben verschieben");
  up.disabled = !canUp;
  up.onclick = () => moveOrder(collection, docs, index, -1);

  const down = document.createElement("button");
  down.innerHTML = chevronDownIcon;
  down.setAttribute("aria-label","Nach unten verschieben");
  down.disabled = !canDown;
  down.onclick = () => moveOrder(collection, docs, index, 1);

  wrap.append(up,down);
  return wrap;
}

/* =========================
   EINKAUFSLISTE SORTIEREN (Preis / Erstellungsdatum / Priorität)
========================= */
let shoppingDocsCache = [];

const sortLabels = { price:"Preis", date:"Erstellungsdatum", priority:"Priorität" };

window.sortShoppingList = async function(criterion){
  const nonWish = shoppingDocsCache.filter(d=>!d.data.wish);
  const wish = shoppingDocsCache.filter(d=>d.data.wish);

  const comparator = criterion === "price"
    ? (a,b) => {
        const pa = parsePrice(a.data.price), pb = parsePrice(b.data.price);
        return (pa===null?Infinity:pa) - (pb===null?Infinity:pb);
      }
    : criterion === "priority"
    ? (a,b) => (priorityRank[a.data.priority]??3) - (priorityRank[b.data.priority]??3)
    : (a,b) => (a.data.createdAt||0) - (b.data.createdAt||0);

  nonWish.sort(comparator);
  wish.sort(comparator);

  const ordered = [...nonWish, ...wish];
  await Promise.all(ordered.map((d,i)=>updateDoc(doc(db,"shoppingList",d.id), { order:i })));
  showStatus("✅ Sortiert nach " + sortLabels[criterion], false);
  sortDropdown.open = false;
};

function renderMachines(){

  const topLevel = Object.values(machineInfoCache).filter(m=>!m.parentSlug);

    empty.className = "empty-state";
    empty.textContent = "Noch keine Maschinen angelegt.";
    machineGrid.appendChild(empty);
    return;

  const groups = {};
  topLevel.forEach(m=>{
    const gid = m.groupId || machineSlug(m.name);
    (groups[gid] = groups[gid] || []).push(m);
  });
  Object.values(groups)
    .map(members=>{
      members.sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
      return { minCreated: Math.min(...members.map(m=>m.createdAt||0)), members };
    })
    .sort((a,b)=>a.minCreated-b.minCreated)
    .forEach(({members})=>{
      const box = document.createElement("div");
      box.className = "machine-group";
      members.forEach(m=>box.appendChild(createMachineRow(m)));
      machineGrid.appendChild(box);
    });
}

/* =========================
   LIVE SYNC
========================= */
onSnapshot(shoppingRef, s=>{
  const allDocs = s.docs.map(d=>({data:d.data(), id:d.id}));
  purchasedShoppingCache = allDocs.filter(d=>d.data.purchased).map(d=>({...d, collection:"shoppingList"}));
  const docs = allDocs.filter(d=>!d.data.purchased);

  shoppingList.innerHTML="";
  if(docs.length===0){
    shoppingDocsCache=[];
    shoppingList.appendChild(renderEmptyState("Noch keine Artikel auf der Einkaufsliste."));
  } else {
    docs.sort((a,b)=>{
      const w = (a.data.wish?1:0) - (b.data.wish?1:0);
      if(w !== 0) return w;
      return (a.data.order ?? a.data.createdAt ?? 0) - (b.data.order ?? b.data.createdAt ?? 0);
    });
    shoppingDocsCache = docs;
    docs.forEach(({data,id},index)=>shoppingList.appendChild(render(data,id,"shoppingList",docs,index)));
  }
  renderTrash();
}, e=>showStatus("❌ Firebase-Verbindungsfehler: " + e.message, true));

onSnapshot(wishRef, s=>{
  const allDocs = s.docs.map(d=>({data:d.data(), id:d.id}));
  purchasedWishCache = allDocs.filter(d=>d.data.purchased).map(d=>({...d, collection:"wishList"}));
  const docs = allDocs.filter(d=>!d.data.purchased);

  wishList.innerHTML="";
  if(docs.length===0){
    wishList.appendChild(renderEmptyState("Noch keine Artikel für die AG Materialbeschaffung eingetragen."));
  } else {
    docs.sort((a,b)=>(a.data.order ?? a.data.createdAt ?? 0) - (b.data.order ?? b.data.createdAt ?? 0));
    docs.forEach(({data,id},index)=>wishList.appendChild(render(data,id,"wishList",docs,index)));
  }
  wishDocsCache = docs;
  updateWishTotal(docs);
  renderTrash();
}, e=>showStatus("❌ Firebase-Verbindungsfehler: " + e.message, true));

onSnapshot(fundingRef, s=>{
  const allDocs = s.docs.map(d=>({data:d.data(), id:d.id}));
  purchasedFundingCache = allDocs.filter(d=>d.data.purchased).map(d=>({...d, collection:"fundingList"}));
  const docs = allDocs.filter(d=>!d.data.purchased);

  fundingList.innerHTML="";
  if(docs.length===0){
    fundingList.appendChild(renderEmptyState("Noch keine Artikel für den Förderantrag eingetragen."));
  } else {
    docs.sort((a,b)=>(a.data.order ?? a.data.createdAt ?? 0) - (b.data.order ?? b.data.createdAt ?? 0));
    docs.forEach(({data,id},index)=>fundingList.appendChild(render(data,id,"fundingList",docs,index)));
  }
  renderTrash();
}, e=>showStatus("❌ Firebase-Verbindungsfehler: " + e.message, true));

let inventoryDocsCache = [];

onSnapshot(inventoryRef, s=>{
  inventoryDocsCache = s.docs.map(d=>({data:d.data(), id:d.id}));
  inventoryList.innerHTML="";
  if(s.empty){ inventoryList.appendChild(renderEmptyState("Inventar ist leer.")); return; }
  s.forEach(d=>inventoryList.appendChild(renderInv(d.data(),d.id)));
  renderSubMachines();
  populateAssignPanel();
}, e=>showStatus("❌ Firebase-Verbindungsfehler: " + e.message, true));

let machineInfoCache = {};

onSnapshot(machinesRef, s=>{
  machineInfoCache = {};
  s.forEach(d=>{ machineInfoCache[d.id] = { ...normalizeMachineInfo(d.data()), id:d.id }; });

  renderMachines();
  renderSubMachines();
  populateMachineDropdown();
  populateAssignPanel();
}, e=>showStatus("❌ Firebase-Verbindungsfehler: " + e.message, true));

</script>
