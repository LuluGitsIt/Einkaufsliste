<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Einkaufsliste Holzwerkstatt</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪵</text></svg>" />

<style>
:root{
  --bg:#f4efe6;
  --surface:#ffffff;
  --border:#e6dfd0;
  --text:#2c2620;
  --text-muted:#7a7264;
  --primary:#b3661d;
  --primary-dark:#8f5015;
  --danger:#c0392b;
  --danger-bg:#fbdedb;
  --warning:#8a6a06;
  --warning-bg:#fdf0cd;
  --violet:#5732a8;
  --violet-bg:#e6ddf7;
  --wish:#a3226e;
  --wish-bg:#fbe2ef;
  --wish-item-bg:#fdf3f8;
  --radius:10px;
  --shadow:0 1px 3px rgba(43,34,20,0.08),0 1px 2px rgba(43,34,20,0.05);
}

*{ box-sizing:border-box; }

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  margin:0;
}

.page{
  max-width:880px;
  margin:0 auto;
  padding:36px 20px 80px;
}

.app-header{
  text-align:center;
  margin-bottom:28px;
}

.app-header h1{
  font-size:26px;
  margin:0;
  letter-spacing:-.01em;
}

#statusMsg{
  display:none;
  position:sticky;
  top:12px;
  z-index:10;
  padding:12px 16px;
  margin-bottom:18px;
  border-radius:var(--radius);
  font-weight:600;
  font-size:14px;
  box-shadow:var(--shadow);
}

.toolbar{
  display:flex;
  gap:10px;
  margin-bottom:24px;
  flex-wrap:wrap;
}

.toolbar button{
  padding:12px 20px;
  border-radius:10px;
  font-size:14px;
  font-weight:600;
  box-shadow:var(--shadow);
}

.btn-add{ background:var(--primary); color:#fff; }
.btn-add:hover{ background:var(--primary-dark); }

.btn-inventory{ background:var(--surface); color:var(--text); border:1px solid var(--border); }
.btn-inventory:hover{ background:var(--bg); }
.btn-inventory.active{ background:var(--primary); color:#fff; border-color:var(--primary); }

.tab-content{ display:none; }
.tab-content.active{ display:block; }

.card{
  background:var(--surface);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:22px;
  margin-bottom:24px;
}

.card h2{
  margin:0 0 4px;
  font-size:17px;
}

.card .card-subtitle{
  margin:0 0 16px;
  font-size:12.5px;
  color:var(--text-muted);
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-bottom:14px;
}

.form-grid .full{ grid-column:1 / -1; }

label{
  display:block;
  font-size:11px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.04em;
  color:var(--text-muted);
  margin-bottom:5px;
}

input,select{
  width:100%;
  padding:10px 12px;
  border:1px solid var(--border);
  border-radius:8px;
  font-size:14px;
  background:#fff;
  color:var(--text);
  font-family:inherit;
}

input:focus,select:focus{
  outline:none;
  border-color:var(--primary);
}

button{
  border:none;
  border-radius:8px;
  font-family:inherit;
  font-weight:600;
  cursor:pointer;
  transition:background .15s,transform .05s;
}

button:active{ transform:scale(0.97); }

.btn-primary{
  width:100%;
  padding:11px 16px;
  font-size:14px;
  background:var(--primary);
  color:#fff;
}

.btn-primary:hover{ background:var(--primary-dark); }

ul{ list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:10px; }

li.item{
  display:flex;
  justify-content:space-between;
  align-items:stretch;
  gap:14px;
  padding:14px 16px;
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:var(--radius);
}

li.item.wish{
  background:var(--wish-item-bg);
  border-color:#f0c7de;
}

.item-info{
  display:flex;
  flex-direction:column;
  gap:7px;
  flex:1;
  min-width:0;
}

.item-info strong.item-name{
  font-size:15px;
  overflow-wrap:anywhere;
}

.badges{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.item-meta{
  font-size:12.5px;
  color:var(--text-muted);
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

.item-meta a{
  color:var(--primary);
  text-decoration:none;
  font-weight:600;
}

.item-meta a:hover{ text-decoration:underline; }

.item-meta b{
  color:var(--text);
  font-weight:700;
}

.priority-swatch{
  width:14px;
  align-self:stretch;
  flex-shrink:0;
  border:none;
  border-radius:7px;
  cursor:pointer;
  padding:0;
  transition:opacity .15s,transform .05s;
}

.priority-swatch:hover{ opacity:.82; }
.priority-swatch:active{ transform:scale(0.94); }
.priority-swatch.green{ background:#3fa757; }
.priority-swatch.yellow{ background:#eeb412; }
.priority-swatch.red{ background:#dd4b3e; }

.badge-wish{
  font-size:11px;
  font-weight:700;
  padding:3px 10px;
  border-radius:20px;
  width:fit-content;
  background:var(--wish-bg);
  color:var(--wish);
}

.item-menu{
  position:relative;
  flex-shrink:0;
  display:flex;
  align-items:center;
}

.item-menu summary{
  list-style:none;
  cursor:pointer;
  width:32px;
  height:32px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--text-muted);
  transition:color .15s;
}

.item-menu summary svg{ width:20px; height:20px; }
.item-menu summary::-webkit-details-marker{ display:none; }
.item-menu summary:hover{ color:var(--primary); }
.item-menu[open] summary{ color:var(--primary); }

.actions{
  position:absolute;
  top:42px;
  right:0;
  display:flex;
  flex-direction:column;
  gap:6px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:10px;
  box-shadow:var(--shadow);
  padding:8px;
  width:min(230px,80vw);
  z-index:5;
}

.actions button{
  padding:9px 12px;
  font-size:13px;
  text-align:left;
  width:100%;
}

button.delete{ background:var(--danger-bg); color:var(--danger); }
button.delete:hover{ background:#f4c6c1; }
button.move{ background:var(--warning-bg); color:var(--warning); }
button.move:hover{ background:#f9e4a8; }
button.copy{ background:var(--violet-bg); color:var(--violet); }
button.copy:hover{ background:#d9c9f2; }
button.wish-toggle{ background:var(--wish-bg); color:var(--wish); }
button.wish-toggle:hover{ background:#f6cce4; }

.empty-state{
  text-align:center;
  color:var(--text-muted);
  font-size:13.5px;
  padding:28px 10px;
  border:1px dashed var(--border);
  border-radius:var(--radius);
}

@media(max-width:600px){
  .form-grid{ grid-template-columns:1fr; }
}
</style>
</head>

<body>

<div class="page">

<div class="app-header">
  <h1>🪵 Einkaufssystem Holzwerkstatt</h1>
</div>

<div id="statusMsg"></div>

<div class="toolbar">
  <button id="addFormBtn" class="btn-add" onclick="toggleAddForm()">+ Artikel hinzufügen</button>
  <button id="inventoryBtn" class="btn-inventory" onclick="toggleView()">📦 Inventar</button>
</div>

<div id="addForm" class="card" style="display:none;">
  <h2>Artikel hinzufügen</h2>

  <div class="form-grid">
    <div class="full">
      <label>Ziel-Liste</label>
      <select id="newTarget">
        <option value="shoppingList">🛒 Einkaufsliste</option>
        <option value="wishList">🏗️ AG Materialbeschaffung</option>
      </select>
    </div>
    <div class="full">
      <label>Artikel</label>
      <input id="newName" placeholder="z. B. Schleifpapier 120er" />
    </div>
    <div>
      <label>Link (optional)</label>
      <input id="newLink" placeholder="https://…" />
    </div>
    <div>
      <label>Preis (optional)</label>
      <input id="newPrice" placeholder="z. B. 12,90 €" />
    </div>
    <div>
      <label>Priorität</label>
      <select id="newPriority">
        <option value="green">🟢 Grün</option>
        <option value="yellow">🟡 Gelb</option>
        <option value="red">🔴 Rot</option>
      </select>
    </div>
    <div>
      <label>Name</label>
      <input id="newUser" placeholder="Wer trägt ein?" />
    </div>
  </div>

  <button class="btn-primary" onclick="submitNewItem()">Hinzufügen</button>
</div>

<!-- LISTEN -->
<div id="lists" class="tab-content active">

<div class="card">
  <h2>🏗️ Einkauf AG Materialbeschaffung</h2>
  <p class="card-subtitle">Artikel, die von der AG Materialbeschaffung bestellt werden</p>

  <ul id="wishList"></ul>
</div>

<div class="card">
  <h2>🛒 Einkaufsliste</h2>
  <p class="card-subtitle">Allgemeiner Bedarf – Wunschartikel werden farblich markiert und nach unten sortiert</p>

  <ul id="shoppingList"></ul>
</div>

</div>

<!-- INVENTAR -->
<div id="inventory" class="tab-content">
  <div class="card">
    <h2>📦 Inventar</h2>
    <ul id="inventoryList"></ul>
  </div>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  deleteDoc,
  doc,
  onSnapshot,
  setDoc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyBP3oj8MkzyDxiFWygr7xPN4ixUbPoEVBM",
  authDomain: "einkaufsliste-138fd.firebaseapp.com",
  projectId: "einkaufsliste-138fd",
  storageBucket: "einkaufsliste-138fd.firebasestorage.app",
  messagingSenderId: "892194095441",
  appId: "1:892194095441:web:0205864f9dcb1fb03bd370"
});

const db = getFirestore(app);

const shoppingRef = collection(db,"shoppingList");
const wishRef = collection(db,"wishList");
const inventoryRef = collection(db,"inventory");

const priorityLabels = { green:"Grün", yellow:"Gelb", red:"Rot" };
const priorityOrder = ["green","yellow","red"];
const collectionLabels = { shoppingList:"Einkaufsliste", wishList:"AG Materialbeschaffung" };

const gearIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="12" cy="12" r="3"></circle>
  <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82A1.65 1.65 0 0 0 3 13.09H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
</svg>`;

/* =========================
   NORMALIZER (WICHTIG!)
========================= */
function normalize(data){
  return {
    name: data.name || "",
    link: data.link || "",
    price: data.price || "",
    priority: data.priority || "green",
    user: data.user || "Unbekannt",
    createdAt: data.createdAt || Date.now(),
    wish: data.wish || false
  };
}

/* =========================
   STATUS / FEHLERANZEIGE
========================= */
function showStatus(msg, isError){
  const el = document.getElementById("statusMsg");
  el.textContent = msg;
  el.style.display = "block";
  el.style.background = isError ? "#fbdedb" : "#ddf0e1";
  el.style.color = isError ? "#c0392b" : "#1f6b3f";
  if(!isError) setTimeout(()=>{ el.style.display="none"; }, 3000);
}

/* =========================
   ANSICHT UMSCHALTEN (Listen <-> Inventar)
========================= */
window.toggleView = function(){
  const showInventory = !inventory.classList.contains("active");
  lists.classList.toggle("active", !showInventory);
  inventory.classList.toggle("active", showInventory);
  inventoryBtn.textContent = showInventory ? "🛒 Zu den Listen" : "📦 Inventar";
  inventoryBtn.classList.toggle("active", showInventory);
};

/* =========================
   ADD-FORMULAR EIN-/AUSBLENDEN
========================= */
window.toggleAddForm = function(){
  const show = addForm.style.display === "none";
  addForm.style.display = show ? "block" : "none";
  addFormBtn.textContent = show ? "✕ Formular schließen" : "+ Artikel hinzufügen";
};

/* =========================
   INVENTAR SAVE (deduped via setDoc, gleiche ID wie im Listeneintrag)
========================= */
async function saveToInventory(data, id){
  const item = normalize(data);
  await setDoc(doc(inventoryRef, id), {
    ...item,
    savedAt: Date.now()
  });
}

/* =========================
   ADD
========================= */
window.submitNewItem = async function(){
  const data = normalize({
    name:newName.value,
    link:newLink.value,
    price:newPrice.value,
    priority:newPriority.value,
    user:newUser.value
  });

  if(!data.name || !data.user) return;

  const target = newTarget.value;
  const targetRef = target === "shoppingList" ? shoppingRef : wishRef;

  try {
    const ref = await addDoc(targetRef, data);
    await saveToInventory(data, ref.id);
    showStatus(`✅ Gespeichert in ${collectionLabels[target]}: ` + data.name, false);
    newName.value="";
    newLink.value="";
    newPrice.value="";
  } catch(e) {
    showStatus("❌ Fehler beim Speichern: " + e.message, true);
    console.error(e);
  }
};

/* =========================
   MOVE (gleiche ID im Ziel -> kein Duplikat im Inventar)
========================= */
async function move(data,id,from){
  const targetCollection = from==="shoppingList" ? "wishList" : "shoppingList";
  const normalized = normalize(data);
  normalized.wish = false;

  await setDoc(doc(db, targetCollection, id), normalized);
  await saveToInventory(normalized, id);
  await deleteDoc(doc(db, from, id));
}

/* =========================
   WUNSCHARTIKEL TOGGLE (nur Einkaufsliste)
========================= */
async function toggleWish(data,id){
  const newWish = !data.wish;
  await updateDoc(doc(db,"shoppingList",id), { wish:newWish });
  await saveToInventory({ ...data, wish:newWish }, id);
}

/* =========================
   PRIORITÄT DURCHSCHALTEN (Klick auf Farbfläche)
========================= */
async function cyclePriority(collection,data,id){
  const next = priorityOrder[(priorityOrder.indexOf(data.priority)+1) % priorityOrder.length];
  await updateDoc(doc(db,collection,id), { priority:next });
  if(collection !== "inventory"){
    await saveToInventory({ ...data, priority:next }, id);
  }
}

function createPrioritySwatch(collection,data,id){
  const swatch = document.createElement("button");
  swatch.className = "priority-swatch " + data.priority;
  swatch.title = `Priorität: ${priorityLabels[data.priority] || data.priority} (klicken zum Ändern)`;
  swatch.setAttribute("aria-label", "Priorität ändern");
  swatch.onclick = () => cyclePriority(collection,data,id);
  return swatch;
}

/* =========================
   COPY FROM INVENTORY (gleiche ID -> kein Duplikat im Inventar)
========================= */
async function copyTo(target, data, id){
  await setDoc(doc(db, target, id), normalize(data));
}

/* =========================
   RENDER ITEM
========================= */
function render(data,id,collection){
  const li = document.createElement("li");
  li.className = "item" + (collection==="shoppingList" && data.wish ? " wish" : "");

  const info = document.createElement("div");
  info.className="item-info";

  info.innerHTML=`
    <strong class="item-name">${data.name}</strong>
    ${collection==="shoppingList" && data.wish ? `<div class="badges"><span class="badge-wish">🎁 Wunschartikel</span></div>` : ""}
    <div class="item-meta">
      <span><b>Name:</b> ${data.user}</span>
      <span><b>Datum:</b> ${new Date(data.createdAt).toLocaleDateString()}</span>
      ${data.price ? `<span><b>Preis:</b> ${data.price}</span>` : ""}
      ${data.link ? `<a href="${data.link}" target="_blank" rel="noopener"><b>Link:</b> 🔗</a>` : ""}
    </div>
  `;

  const swatch = createPrioritySwatch(collection,data,id);

  const menu = document.createElement("details");
  menu.className="item-menu";

  const summary = document.createElement("summary");
  summary.innerHTML=gearIcon;
  summary.setAttribute("aria-label","Aktionen");
  menu.append(summary);

  const actions = document.createElement("div");
  actions.className="actions";

  if(collection==="shoppingList"){
    const wishBtn = document.createElement("button");
    wishBtn.className="wish-toggle";
    wishBtn.textContent = data.wish ? "🛒 Zur Einkaufsliste" : "🎁 Als Wunsch markieren";
    wishBtn.onclick=()=>toggleWish(data,id);
    actions.append(wishBtn);
  }

  const moveBtn = document.createElement("button");
  moveBtn.className="move";
  moveBtn.textContent = collection==="shoppingList" ? "🏗️ Zur Materialbeschaffung" : "🛒 Zur Einkaufsliste";
  moveBtn.onclick=()=>move(data,id,collection);

  const del = document.createElement("button");
  del.className="delete";
  del.textContent="🗑️ Artikel löschen";
  del.onclick = async () => {
    await saveToInventory(data, id);
    await deleteDoc(doc(db, collection, id));
  };

  actions.append(moveBtn,del);
  menu.append(actions);

  li.append(swatch,info,menu);
  return li;
}

/* =========================
   INVENTORY RENDER
========================= */
function renderInv(data,id){
  const li=document.createElement("li");
  li.className = "item";

  const info=document.createElement("div");
  info.className="item-info";
  info.innerHTML=`
    <strong class="item-name">${data.name}</strong>
    ${data.wish ? `<div class="badges"><span class="badge-wish">🎁 Wunschartikel</span></div>` : ""}
    <div class="item-meta">
      <span><b>Name:</b> ${data.user}</span>
      ${data.price ? `<span><b>Preis:</b> ${data.price}</span>` : ""}
      ${data.link ? `<a href="${data.link}" target="_blank" rel="noopener"><b>Link:</b> 🔗</a>` : ""}
    </div>
  `;

  const swatch = createPrioritySwatch("inventory",data,id);

  const menu=document.createElement("details");
  menu.className="item-menu";

  const summary=document.createElement("summary");
  summary.innerHTML=gearIcon;
  summary.setAttribute("aria-label","Aktionen");
  menu.append(summary);

  const actions=document.createElement("div");
  actions.className="actions";

  const toShop=document.createElement("button");
  toShop.className="copy";
  toShop.textContent="🛒 Zur Einkaufsliste";
  toShop.onclick=()=>copyTo("shoppingList",data,id);

  const toWish=document.createElement("button");
  toWish.className="copy";
  toWish.textContent="🏗️ Zur Materialbeschaffung";
  toWish.onclick=()=>copyTo("wishList",data,id);

  const del=document.createElement("button");
  del.className="delete";
  del.textContent="🗑️ Artikel löschen";
  del.onclick=()=>deleteDoc(doc(db,"inventory",id));

  actions.append(toShop,toWish,del);
  menu.append(actions);

  li.append(swatch,info,menu);
  return li;
}

function renderEmptyState(text){
  const li = document.createElement("li");
  li.className = "empty-state";
  li.textContent = text;
  return li;
}

/* =========================
   LIVE SYNC
========================= */
onSnapshot(shoppingRef, s=>{
  shoppingList.innerHTML="";
  if(s.empty){ shoppingList.appendChild(renderEmptyState("Noch keine Artikel auf der Einkaufsliste.")); return; }
  const docs = s.docs.map(d=>({data:d.data(), id:d.id}));
  docs.sort((a,b)=>{
    const w = (a.data.wish?1:0) - (b.data.wish?1:0);
    if(w !== 0) return w;
    return (a.data.createdAt||0) - (b.data.createdAt||0);
  });
  docs.forEach(({data,id})=>shoppingList.appendChild(render(data,id,"shoppingList")));
}, e=>showStatus("❌ Firebase-Verbindungsfehler: " + e.message, true));

onSnapshot(wishRef, s=>{
  wishList.innerHTML="";
  if(s.empty){ wishList.appendChild(renderEmptyState("Noch keine Artikel für die AG Materialbeschaffung eingetragen.")); return; }
  s.forEach(d=>wishList.appendChild(render(d.data(),d.id,"wishList")));
}, e=>showStatus("❌ Firebase-Verbindungsfehler: " + e.message, true));

onSnapshot(inventoryRef, s=>{
  inventoryList.innerHTML="";
  if(s.empty){ inventoryList.appendChild(renderEmptyState("Inventar ist leer.")); return; }
  s.forEach(d=>inventoryList.appendChild(renderInv(d.data(),d.id)));
}, e=>showStatus("❌ Firebase-Verbindungsfehler: " + e.message, true));

</script>

</body>
</html>
